# Match the minimum length and character rules in the app.
[auth]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

# RevenueCat authenticates with REVENUECAT_WEBHOOK_AUTH rather than a Supabase JWT.
[functions.revenuecat-webhook]
verify_jwt = false

[functions.revenuecat-subscription-sync]
verify_jwt = true

# Notifications are re-verified against RevenueCat; their payload never grants access.
[functions.revenuecat-subscription-webhook]
verify_jwt = false

# Cron only: the handler also requires the service-role credential.
[functions.notify-prayer-activity]
verify_jwt = true
